<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style-signup.css" />
    <title>Sign up</title>
  </head>
  <body>
    <div class="container">
      <div class="form">
        <h1 class="form--title">Sign Up</h1>
        <p class="form--text">Please fill in this form to create an account.</p>
        <div class="form--item">
          <label class="form--label" for="">Username </label>
          <input class="form--input" type="text" placeholder="Enter Username"/>
        </div>
        <div class="form--item">
          <label class="form--label" for="">Email </label>
          <input class="form--input" type="email" placeholder="Enter Email" />
        </div>
        <div class="form--item">
          <label class="form--label" for="">Password</label>
          <input class="form--input" type="password" placeholder="Enter Password"/>
        </div>
        <div class="form--item">
          <label class="form--label" for="">Phone Number</label>
          <div class="form--item__phone-nb">
            <select class="form-select">
                <option value="">code</option>
                <option value="">+98</option>
                <option value="">+99</option>
                <option value="">+90</option>
                <option value="">+66</option>
            </select>
            <input class="form--input" type="phone" placeholder="812345678"/>
          </div>
        </div>
        <p class="form--text">By creating an account you agree to our <a href="">Terms & Privacy.</a></p>
        <button class="form--btn">Sign Up</button>
        <a href="./index.html" class="btn">Go to Log in</a>
    

        
        
      </div>
    </div>
  </body>
</html>
